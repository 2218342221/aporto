[connections.primary]
endpoint = "https://api.openai.com/v1/responses"
api_key = { env = "OPENAI_API_KEY" }
timeout_ms = 120000

[connections.primary.headers]
X-Agent-Name = "reviewer"

[[agents]]
id = "reviewer"
bundle = "./dist/reviewer-docker.agent.json"

# Provider and image come from the bundle's [runtime].
[agents.runtime]
host = "unix:///var/run/docker.sock"
binary = "docker"
memory_mb = 512
cpus = 2
pids_limit = 128
network = "none"

