[workspace]
members = [".", "crates/protocol", "crates/core", "crates/core-client", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[package]
name = "aporto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A framework for building and running custom agents with Docker or AgentENV"
readme = "README.md"

[dependencies]
fs2 = "0.4"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
rquickjs = { version = "0.14", features = ["futures", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
jsonschema = { version = "0.33", default-features = false }
prost = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
