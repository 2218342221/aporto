[package]
name = "aporto-server"
default-run = "aporto-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authenticated HTTP and SSE interface for Aporto Core"

[features]
test-fixtures = []

[dependencies]
aporto-core-client = { path = "../core-client" }
aporto-protocol = { path = "../protocol" }
axum = "0.8"
async-stream = "0.3"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "limit"] }
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tempfile = "3"

[[bin]]
name = "aporto-server-core-fixture"
path = "tests/fixtures/core.rs"
test = false
required-features = ["test-fixtures"]
