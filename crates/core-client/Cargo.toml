[package]
name = "aporto-core-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Asynchronous client and process supervisor for Aporto Core"

[features]
test-fixtures = []

[dependencies]
aporto-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time", "macros"] }
tokio-util = "0.7"

[[bin]]
name = "aporto-rpc-fixture"
path = "tests/fixtures/rpc_child.rs"
test = false
required-features = ["test-fixtures"]
